# The gate every change passes: formatted, clippy-clean, documented,
# and tested on Linux and macOS, at the pinned minimum Rust as well
# as stable. The tests load Virtua Grotesk from its own repository,
# checked out beside this one the way a developer has it, so they run
# against the current font.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: runebender-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runebender-core
      - name: fmt
        working-directory: runebender-core
        run: cargo fmt --check
      - name: clippy
        working-directory: runebender-core
        run: cargo clippy --all-targets
      - name: doc
        working-directory: runebender-core
        run: cargo doc --no-deps

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
        include:
          # The minimum supported Rust, from rust-version in Cargo.toml.
          - os: ubuntu-latest
            rust: "1.88"
    steps:
      - uses: actions/checkout@v4
        with:
          path: runebender-core
      - name: Fixture fonts
        uses: actions/checkout@v4
        with:
          repository: eliheuer/virtua-grotesk
          path: virtua-grotesk
          sparse-checkout: sources
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runebender-core
      - name: test
        working-directory: runebender-core
        run: cargo test

  vet:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned: the store is written by whichever version formats it,
      # and an older cargo-vet rejects a newer one's formatting.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.2
      # Audits and exemptions live in supply-chain/. A new dependency
      # fails here until it is vetted or exempted on purpose.
      - name: cargo vet
        run: cargo vet --locked

  advisories:
    name: security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # RustSec advisories against anything in the lock file. Unlike
      # the rest of CI this can go red without a change of ours, when
      # an advisory is published; that is the point of it.
      - name: cargo deny check advisories
        run: cargo deny --locked check advisories
