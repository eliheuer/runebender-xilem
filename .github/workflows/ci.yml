# The gate every change passes: formatted, clippy-clean, documented,
# and built and tested on Linux and macOS. The Linux job installs the
# libraries winit, Vello, and the native file dialog link against.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  RUST_STABLE_VER: "1.96"

jobs:
  quality:
    name: formatting and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: Install Taplo
        uses: uncenter/setup-taplo@09968a8ae38d66ddd3d23802c44bf6122d7aa991
        with:
          version: "0.9.3"
      - name: taplo fmt
        run: taplo fmt --check --diff
      - name: Copyright headers
        run: bash .github/copyright.sh
      - name: Typos
        uses: crate-ci/typos@v1.45.0

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: eliheuer/virtua-grotesk
          path: test-fonts
      - name: Set font fixtures
        run: echo "RUNEBENDER_TEST_FONTS=$GITHUB_WORKSPACE/test-fonts/sources" >> "$GITHUB_ENV"
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcb1-dev libvulkan1 libssl-dev \
            libglib2.0-dev libgtk-3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: doc
        run: cargo doc --workspace --no-deps --locked
      - name: test
        run: cargo test --workspace --locked -- --test-threads=1
      - name: build
        run: cargo build --workspace --release --locked

  advisories:
    name: security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # RustSec advisories against anything in the lock file. Unlike
      # the rest of CI this can go red without a change of ours, when
      # an advisory is published; that is the point of it.
      - name: cargo deny check advisories
        run: cargo deny --locked check advisories
