# Ten Base UI stops, 01–10, progress from darkest to lightest.
# Glyph Grid names carry the same mark meaning across themes.
# See https://runebender.org/docs/themes.html for the full format.
formatVersion = 1
id = "dark"
name = "Dark"
markStep = "bright"
markStyle = "fill"
markOutline = "baseUi.01"
markInk = "baseUi.01"
pointStyle = "ring"
pointHalo = true

[baseUi]
"01" = "oklch(0.15 0 255)"
"02" = "oklch(0.18 0 255)"
"03" = "oklch(0.23 0 255)"
"04" = "oklch(0.31 0 255)"
"05" = "oklch(0.37 0 255)"
"06" = "oklch(0.43 0 255)"
"07" = "oklch(0.55 0 255)"
"08" = "oklch(0.6 0 255)"
"09" = "oklch(0.65 0 255)"
"10" = "oklch(0.81 0 255)"

[glyphGrid]
marks = ["red", "orange", "yellow", "green", "blue", "purple", "pink"]

[glyphGrid.hues]
red = { hue = 27, lightness = 0.61, chroma = 0.167 }
orange = { hue = 46, lightness = 0.68, chroma = 0.15 }
yellow = { hue = 96, lightness = 0.82, chroma = 0.135 }
green = { hue = 152, lightness = 0.69, chroma = 0.126 }
teal = { hue = 186, lightness = 0.7, chroma = 0.095 }
blue = { hue = 248, lightness = 0.64, chroma = 0.119 }
purple = { hue = 292, lightness = 0.61, chroma = 0.15 }
pink = { hue = 350, lightness = 0.68, chroma = 0.15 }

[glyphGrid.steps]
dim = { lightness = -0.17, chroma = -0.02 }
base = { lightness = 0.0, chroma = 0.0 }
bright = { lightness = 0.13, chroma = -0.03 }
deep = { lightness = -0.26, chroma = 0.0 }

[surfaces]
app = "baseUi.01"
panel = "baseUi.02"
titlebar = "baseUi.01"
control = "baseUi.04"
button = "baseUi.03"
buttonHover = "baseUi.03"
field = "baseUi.02"
outline = "baseUi.05"
fieldOutline = "baseUi.03"
divider = "baseUi.03"
canvas = "baseUi.01"
tabRail = "baseUi.01"
inactiveTab = "baseUi.01"
header = "baseUi.01"
gridBackground = "baseUi.03"
cellShadow = "baseUi.06"
floatingPaneHeader = "baseUi.02"
sliderTrack = "baseUi.06"

[text]
primary = "baseUi.09"
secondary = "baseUi.08"
muted = "baseUi.08"
subdued = "baseUi.06"
overlay = "baseUi.10"
glyph = "baseUi.08"
headerInk = "baseUi.09"

[roles]
gridSelected = "baseUi.10"
cellSelectedFill = "baseUi.03"
cellSelectedInk = "baseUi.10"
controlSelected = "baseUi.09"
controlSelectedInk = "baseUi.02"
designGridFine = "baseUi.04"
designGridCoarse = "baseUi.05"
accent = "glyphGrid.green.base"
warning = "glyphGrid.yellow.base"
danger = "glyphGrid.red.base"
selection = "glyphGrid.orange.base"
component = "glyphGrid.purple.base"
componentSelected = "glyphGrid.pink.base"
pointSmooth = "glyphGrid.blue.base"
pointCorner = "glyphGrid.green.base"
pointOffcurve = "glyphGrid.purple.base"
pointHyper = "glyphGrid.teal.base"
pointSelected = "glyphGrid.yellow.bright"
pointInner = "baseUi.02"
startNode = "glyphGrid.orange.base"
