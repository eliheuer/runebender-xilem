# Ten Base UI stops, 01–10, progress from darkest to lightest.
# Glyph Grid names carry the same mark meaning across themes.
# See https://runebender.org/docs/themes.html for the full format.
formatVersion = 1
id = "gray"
name = "Gray"
markStep = "base"
markStyle = "fill"
markOutline = "baseUi.01"
markInk = "baseUi.01"
pointStyle = "fill"
pointOutline = "baseUi.01"
pointHalo = false

[baseUi]
"01" = "oklch(0.31 0 255)"
"02" = "oklch(0.37 0 255)"
"03" = "oklch(0.43 0 255)"
"04" = "oklch(0.52 0 255)"
"05" = "oklch(0.6 0 255)"
"06" = "oklch(0.65 0 255)"
"07" = "oklch(0.71 0 255)"
"08" = "oklch(0.76 0 255)"
"09" = "oklch(0.81 0 255)"
"10" = "oklch(0.91 0 255)"

[glyphGrid]
marks = ["red", "orange", "yellow", "green", "blue", "purple", "pink"]

[glyphGrid.hues]
