# See https://runebender.org/docs/themes.html for the full format docs.
#
# OKLCH order: lightness (0–1), chroma (0+, no fixed maximum), hue (0–360 degrees).
# Ten Base UI stops, 00–09, progress from darkest to lightest.
# Rainbow names carry the same mark meaning across themes.

# Theme file format version; keep this at 1.
formatVersion = 1
# Unique identifier used to select this theme.
id = "gray"
# Display name shown in the theme chooser.
name = "Gray"

# Base UI palette: ten reusable stops for neutral surfaces, text, and outlines.
# References such as baseUi.02 point to these values; changing a stop affects every use.
# Chroma 0 makes Gray neutral, so its hue has no visible effect.
[baseUi]
"00" = "oklch(0.30 0 0)"
"01" = "oklch(0.36 0 0)"
"02" = "oklch(0.42 0 0)"
"03" = "oklch(0.48 0 0)"
"04" = "oklch(0.54 0 0)"
"05" = "oklch(0.60 0 0)"
"06" = "oklch(0.66 0 0)"
"07" = "oklch(0.72 0 0)"
"08" = "oklch(0.78 0 0)"
"09" = "oklch(0.84 0 0)"

# Rainbow palette: named hues for glyph marks and semantic editor colors.
[rainbow]
# Glyph mark colors and their order in the mark picker.
marks = ["red", "orange", "yellow", "green", "blue", "purple", "pink"]
# Complete OKLCH colors before the step offsets below are added.
[rainbow.hues]
red = "oklch(0.61 0.167 27)"
orange = "oklch(0.68 0.15 46)"
yellow = "oklch(0.82 0.135 96)"
green = "oklch(0.69 0.126 152)"
blue = "oklch(0.64 0.119 248)"
purple = "oklch(0.61 0.15 292)"
pink = "oklch(0.68 0.15 350)"

# Signed OKLCH offsets added to each hue, not complete colors.
# Negative lightness darkens; positive lightness brightens; chroma changes saturation.
# The hue offset must be 0; hue rotation is not supported. Base adds no offsets.
[rainbow.steps]
dim = "oklch(-0.17 -0.02 0)"
base = "oklch(0.0 0.0 0)"
bright = "oklch(0.13 -0.03 0)"
deep = "oklch(-0.26 0.0 0)"

# How the palettes are applied to glyph tiles and outline points.
[drawing]
# Rainbow step used for glyph marks: dim, base, bright, or deep.
markStep = "base"
# Glyph mark treatment: fill colors the tile; border colors its outline.
markStyle = "fill"
# Outline around a tile with a filled rainbow mark.
markOutline = "baseUi.00"
# Glyph and caption color on filled rainbow tiles.
markInk = "baseUi.00"
# Outline point treatment: fill uses colored interiors; ring uses colored rings.
pointStyle = "fill"
# Outline around filled point markers.
pointOutline = "baseUi.00"
# Add a canvas-colored halo around points and anchors to separate them from paths.
pointHalo = false

# Backgrounds, fills, outlines, and shadows. Values reference palette tokens.
[surfaces]
# Window background behind the floating panels.
app = "baseUi.02"
# Gray overlay on the native macOS blur; independent of the opaque app background.
# Its opacity is window.blurTintOpacity. Other hosts ignore this tint.
backdropTint = "#808080"
# Main floating panel faces and sidebar backgrounds.
panel = "baseUi.07"
# Face color of frosted side panels (window.blurPanels); defaults to panel. It is lighter
# than panel so that, mixed with the darker blur, the face lands near the solid panel value
# and fields, tabs and rows keep their contrast.
panelTint = "baseUi.09"
# Floating panel shadow color; currently drawn at 50% opacity, 2 px down and left.
# Enable or disable it with geometry.shadowPanel below.
panelShadow = "baseUi.01"
# Title bar background in hosts that draw it separately.
titlebar = "baseUi.02"
# General control surface, including slider handles.
control = "baseUi.06"
# Default button face.
button = "baseUi.07"
# Button face when hovered in controls that use a hover fill.
buttonHover = "baseUi.08"
# Editable text field background.
field = "baseUi.08"
# Structural outlines: floating panels, glyph tiles, and selected sidebar rows.
outline = "baseUi.00"
# Text field outline.
fieldOutline = "baseUi.00"
# Shared divider color; native panel rules currently use outline.
divider = "baseUi.00"
# Editing canvas background inside its floating panel.
canvas = "baseUi.07"
# Independent inspector preview surface; keep the drawing canvas unchanged.
glyphPreview = "baseUi.07"
# Proof strip under the edit canvas: one step darker than the canvas.
proofStrip = "baseUi.06"
# Recessed strip behind the sidebar tool tabs.
tabRail = "baseUi.05"
# Inactive sidebar tool tab face.
inactiveTab = "baseUi.06"
# Background behind the window title and top toolbar.
header = "baseUi.02"
# Ground behind glyph tiles, in both the main grid and editor sidebar grid.
gridBackground = "baseUi.05"
# Hard shadows beneath glyph tiles: 2 px down and left, or 3 px when selected.
cellShadow = "baseUi.04"
# Header of a small floating card, such as the glyph metrics card.
floatingPaneHeader = "baseUi.06"
# Slider rail behind its draggable handle; Gray uses two steps lighter than text.secondary.
# The knob outline uses text.secondary.
sliderTrack = "baseUi.03"
# Normal slider knob fill: one step darker than the panel at 07.
sliderThumb = "baseUi.06"
# Focused or dragged slider knob fill: one step brighter than its normal fill.
sliderThumbActive = "baseUi.07"

# Text and icon colors; kept separate from surface colors for contrast.
[text]
# Solid ink for inactive sidebar tab icons.
inactiveTabInk = "baseUi.03"
# Icon ink on the active sidebar tab; defaults to primary.
activeTabInk = "baseUi.01"
# Text on the window background, including the empty-document welcome view.
appInk = "baseUi.09"
# Normal text and icons on panels.
primary = "baseUi.00"
# Secondary ink, also used for outline control-handle lines.
secondary = "baseUi.01"
# Quieter labels, disclosure markers, and editor controls.
muted = "baseUi.01"
# Lowest-emphasis UI text.
subdued = "baseUi.02"
# Shared ink token for overlay text.
overlay = "baseUi.00"
# Glyph previews and captions on unmarked, unselected glyph-grid tiles.
glyph = "baseUi.01"
# Document title and active top-toolbar text and icons.
headerInk = "baseUi.09"
# Inactive top-toolbar text, icons, and button outlines.
headerMutedInk = "baseUi.08"

# Colors named by editor purpose; shared across hosts, so some are host-specific.
# Values can reference Base UI or Rainbow, or use a literal color such as #17B870.
[roles]
# The save state beside the file name: lighter than the marks, so it reads like the
# header's light ink on the dark header.
savedInk = "oklch(0.84 0.12 152)"
unsavedInk = "oklch(0.80 0.13 27)"
# Editing tools in the header: the active tool, and the others three steps dimmer.
toolActiveInk = "baseUi.08"
toolInactiveInk = "baseUi.05"
# Shared selected-grid color token.
gridSelected = "baseUi.02"
# Shared selected-cell fill token.
cellSelectedFill = "baseUi.02"
# Shared selected-cell ink token.
cellSelectedInk = "baseUi.07"
# Native selected backgrounds, including glyph tiles, sidebar rows, and controls.
# Native selected glyphs and sidebar labels use rainbow.yellow at markStep.
controlSelected = "baseUi.03"
# Contrasting ink for other selected controls.
controlSelectedInk = "baseUi.09"
# Fine design-space grid lines.
designGridFine = "baseUi.02"
# Coarse design-space grid lines.
designGridCoarse = "baseUi.03"
# General accent color.
accent = "rainbow.green.deep"
# Warning state color.
warning = "rainbow.orange.base"
# Error or destructive-state color.
danger = "rainbow.red.deep"
# Selection geometry color, distinct from the selected UI background.
selection = "rainbow.orange.base"
# Unselected component geometry.
component = "rainbow.purple.deep"
# Selected component geometry.
componentSelected = "rainbow.pink.deep"
# Smooth on-curve point markers.
pointSmooth = "rainbow.blue.base"
# Corner on-curve point markers.
pointCorner = "rainbow.green.base"
# Off-curve control point markers.
pointOffcurve = "rainbow.purple.base"
# Hyperbezier-specific point markers.
pointHyper = "rainbow.blue.base"
# Selected point markers.
pointSelected = "rainbow.yellow.base"
# Shared interior color for ring-style point markers.
pointInner = "baseUi.00"
# Contour start marker.
startNode = "rainbow.orange.base"
# Text-tool insertion cursor.
textCursor = "rainbow.orange.base"
# Active kerning indicator.
kernActive = "rainbow.blue.deep"
# Previous kerning indicator.
kernPrevious = "rainbow.orange.base"
# Glyph outline path color.
pathStroke = "baseUi.00"
# Filled proof glyphs and compact editor marks.
previewFill = "baseUi.02"
# Background-layer geometry color; this is not the window background (surfaces.app).
background = "baseUi.03"
# Reference and underlay geometry, also used for inactive layer indicators.
reference = "baseUi.06"
# Contrast halo color used by geometry overlays.
halo = "baseUi.09"
# Quieter metric guides and measurements.
metricQuiet = "baseUi.06"
# Fill beneath editable outlines; native rendering applies 70% opacity.
outlineFill = "baseUi.05"
# Glyph metric lines.
metricsLine = "baseUi.04"
# Point markers on geometry that cannot be edited.
readonlyPoint = "baseUi.03"
# Curvature-continuous join indicator.
continuityG2 = "rainbow.blue.deep"
# Tangent-continuous join indicator.
continuityG1 = "rainbow.yellow.deep"
# Straight join indicator.
continuityLine = "baseUi.03"
# Discontinuous or kinked join indicator.
continuityKink = "rainbow.red.deep"
# Popcount diagnostic tier: one set bit.
popcount1 = "#17B870"
# Popcount diagnostic tier: two set bits.
popcount2 = "#FFDB33"
# Popcount diagnostic tier: three set bits.
popcount3 = "#FF990F"
# Popcount diagnostic tier: four or more set bits.
popcount4 = "#FF4A3D"

[window]
# Native macOS wallpaper blur; disable for the solid app/header background.
# See src/application/platform/window.rs and Xilem issue #1852 for the integration evidence.
# false (or omission) keeps the solid surfaces.app/header colors (baseUi.02 in Gray).
# View > Translucent Window flips this while the application runs.
# Linux, browser, and headless proofs always use flat colors.
blurBackground = true
# Opacity of surfaces.backdropTint over the blur: 0 is clear, 1 is solid.
# Midpoint tint at 0.25 lifts dark wallpaper while retaining visible blur.
# The final blended color still varies with the wallpaper behind the window.
# Used only on macOS with blurBackground enabled.
blurTintOpacity = 0.50
# Hide only main-panel shadows while macOS blur is active.
# Solid mode still uses geometry.shadowPanel; glyph and other shadows are unaffected.
shadowPanels = false
# Let the blur show through the left and right panels too; the center panel stays solid.
# Independent of blurTintOpacity, but it needs blurBackground.
blurPanels = true
# Opacity of surfaces.panelTint over the blur when blurPanels is on: 0 is clear, 1 is solid.
panelTintOpacity = 0.75
# The macOS material behind the blur: menu, popover, sidebar, headerView, hudWindow,
# fullScreenUI, underWindowBackground, or windowBackground. Some let more wallpaper through.
blurMaterial = "menu"
# Draw that material light, dark, or "auto" to follow surfaces.app.
blurAppearance = "auto"

# Shape settings, separate from colors. All dimensions are logical pixels.
# The three radii are independent; rendering caps them to fit the actual shape.
# Changing this bundled file requires rebuilding before the application uses it.
[geometry]
# General corner radius for glyph tiles and small popups, in logical pixels.
# 0 gives square corners; larger values make rounder corners.
radius = 6.0
# Separate corner radius for the large floating workspace panels.
# If omitted, it follows radius; it does not change glyph tiles or buttons.
radiusPanel = 10.0
# Enable floating panel drop shadows; false removes them without moving the panels.
# Shadow color is surfaces.panelShadow; offset and opacity are currently fixed in code.
shadowPanel = true
# Corner radius for buttons, text fields, tabs, and other pressable controls.
# Sidebar selection rows use half this value; panel and glyph tile radii are separate.
# 0 gives square controls; this changes corner shape, not control height or padding.
radiusControl = 4.0
# Shared normal stroke width, in logical pixels; values must be nonnegative.
# Currently parsed but not applied to native line widths, which remain fixed in code.
stroke = 1.0
# Shared emphasized stroke width, normally larger than stroke; must be nonnegative.
# Currently parsed but not applied to native line widths.
strokeEmphasis = 2.0
