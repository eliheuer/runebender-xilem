# A light rose workspace: pink surfaces, pale fields, and deep berry ink.
# Ten Base UI stops, 00–09, progress from darkest to lightest; the darkest are deep berry, not black.
# See https://runebender.org/docs/themes.html for the full format.
formatVersion = 1
id = "strawberry"
name = "Strawberry"

# Rose is part of every Base UI stop, rather than a separate accent.
[baseUi]
"00" = "oklch(0.32 0.085 8)"
"01" = "oklch(0.38 0.09 8)"
"02" = "oklch(0.43 0.07 5)"
"03" = "oklch(0.55 0.09 5)"
"04" = "oklch(0.67 0.11 5)"
"05" = "oklch(0.76 0.09 5)"
"06" = "oklch(0.84 0.07 5)"
"07" = "oklch(0.89 0.05 5)"
"08" = "oklch(0.92 0.045 5)"
"09" = "oklch(0.97 0.014 5)"

# Glyph marks keep Gray's order and meaning, a little lighter and brighter for the rose surfaces.
[rainbow]
marks = ["red", "orange", "yellow", "green", "blue", "purple", "pink"]

[rainbow.hues]
red = "oklch(0.66 0.19 24)"
orange = "oklch(0.74 0.17 50)"
yellow = "oklch(0.87 0.16 98)"
green = "oklch(0.75 0.15 150)"
blue = "oklch(0.70 0.14 248)"
purple = "oklch(0.67 0.17 296)"
pink = "oklch(0.74 0.17 350)"

# Signed OKLCH offsets added to each hue; the final 0 preserves the hue.
[rainbow.steps]
dim = "oklch(-0.17 -0.02 0)"
base = "oklch(0.0 0.0 0)"
bright = "oklch(0.13 -0.03 0)"
deep = "oklch(-0.26 0.0 0)"

[drawing]
# Gray's filled glyph tiles use berry ink and keylines.
markStep = "base"
markStyle = "fill"
markOutline = "baseUi.00"
markInk = "baseUi.00"
# Filled points like Gray's: leaf-green interiors with a deep stem-green keyline.
pointStyle = "fill"
pointOutline = "oklch(0.36 0.07 145)"
pointHalo = false

[surfaces]
app = "baseUi.06"
# Lighter and pinker than the solid ground: the gray blur dulls both, so mixed in it lands
# near surfaces.app. Chroma is about the target divided by blurTintOpacity.
backdropTint = "oklch(0.87 0.10 5)"
panel = "baseUi.07"
titlebar = "baseUi.06"
control = "baseUi.06"
button = "baseUi.07"
buttonHover = "baseUi.08"
field = "baseUi.08"
outline = "baseUi.03"
fieldOutline = "baseUi.03"
divider = "baseUi.04"
canvas = "baseUi.08"
# Independent inspector preview surface; keep the drawing canvas unchanged.
glyphPreview = "baseUi.08"
# Proof strip under the edit canvas: one step darker than the canvas.
proofStrip = "baseUi.07"
tabRail = "baseUi.05"
inactiveTab = "baseUi.06"
header = "baseUi.06"
gridBackground = "baseUi.05"
cellShadow = "baseUi.04"
floatingPaneHeader = "baseUi.06"
sliderTrack = "baseUi.04"
sliderThumb = "baseUi.05"
sliderThumbActive = "baseUi.06"
panelShadow = "baseUi.04"

[text]
appInk = "baseUi.00"
primary = "baseUi.00"
secondary = "baseUi.01"
muted = "baseUi.02"
subdued = "baseUi.03"
overlay = "baseUi.00"
glyph = "baseUi.03"
headerInk = "baseUi.00"
headerMutedInk = "baseUi.01"
# Icons: only the active tab and tool take the darker ink; the rest sit two steps lighter.
activeTabInk = "baseUi.01"
inactiveTabInk = "baseUi.03"
controlInk = "baseUi.03"

[roles]
toolActiveInk = "baseUi.01"
toolInactiveInk = "baseUi.03"
# Save-state labels use darker hues on the pale title bar, independently of glyph marks.
# Chrome colors stay as before; the brighter marks do not lighten them.
savedInk = "oklch(0.42 0.13 145)"
unsavedInk = "oklch(0.44 0.147 27)"
# Selected cells, sidebar rows and controls sit on a dusty berry red, between baseUi.02 and 03.
gridSelected = "oklch(0.50 0.085 5)"
cellSelectedFill = "oklch(0.50 0.085 5)"
cellSelectedInk = "baseUi.09"
controlSelected = "oklch(0.50 0.085 5)"
controlSelectedInk = "baseUi.09"
# Selected glyph tiles and sidebar labels: a bright leaf green instead of Gray's yellow.
selectedContentInk = "oklch(0.82 0.205 148)"
designGridFine = "baseUi.07"
designGridCoarse = "baseUi.06"
accent = "oklch(0.52 0.106 152)"
warning = "rainbow.orange.base"
danger = "oklch(0.44 0.147 27)"
selection = "rainbow.orange.base"
component = "rainbow.purple.dim"
componentSelected = "rainbow.pink.dim"
# Strawberry leaves and stems: every unselected point is a green, selection is orange.
pointSmooth = "oklch(0.76 0.14 126)"
pointCorner = "oklch(0.66 0.15 138)"
pointOffcurve = "oklch(0.86 0.10 118)"
pointHyper = "oklch(0.74 0.11 162)"
pointSelected = "rainbow.orange.base"
pointInner = "baseUi.08"
startNode = "rainbow.orange.dim"
textCursor = "rainbow.orange.dim"
kernActive = "rainbow.blue.dim"
kernPrevious = "rainbow.orange.dim"
pathStroke = "baseUi.01"
previewFill = "baseUi.02"
background = "baseUi.03"
reference = "baseUi.06"
halo = "baseUi.08"
metricQuiet = "baseUi.06"
outlineFill = "baseUi.06"
metricsLine = "baseUi.05"
readonlyPoint = "baseUi.03"
continuityG2 = "rainbow.blue.dim"
continuityG1 = "rainbow.yellow.dim"
continuityLine = "baseUi.03"
continuityKink = "rainbow.red.dim"
popcount1 = "#17B870"
popcount2 = "#FFDB33"
popcount3 = "#FF990F"
popcount4 = "#FF4A3D"

[window]
# Native macOS blur; Linux and other hosts retain the solid rose surfaces.
# The dark menu material keeps the wallpaper visible, where light materials veil it in white;
# a pale tint at high opacity keeps the theme light. Raise blurTintOpacity for a lighter,
# pinker ground; lower it for more wallpaper.
blurBackground = true
blurTintOpacity = 0.85
blurMaterial = "menu"
blurAppearance = "dark"
shadowPanels = false
# Solid side panels: frosted ones lose the theme's pink over the blur.
blurPanels = false

# The same rounding, strokes, and shadow behavior as Gray.
[geometry]
radius = 8.0
radiusPanel = 10.0
shadowPanel = true
radiusControl = 4.0
stroke = 1.0
strokeEmphasis = 2.0
