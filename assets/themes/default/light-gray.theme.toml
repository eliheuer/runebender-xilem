# OKLCH order: lightness (0–1), chroma (0+, no fixed maximum), hue (0–360 degrees).
# Ten Base UI stops, 00–09, progress from darkest to lightest.
# Rainbow names carry the same mark meaning across themes.
# See https://runebender.org/docs/themes.html for the full format.
# Theme file format version; keep this at 1.
formatVersion = 1
# Unique identifier used to select this theme.
id = "light-gray"
# Display name shown in the theme chooser.
name = "Light Gray"

[baseUi]
"00" = "oklch(0.18 0 0)"
"01" = "oklch(0.30 0 0)"
"02" = "oklch(0.42 0 0)"
"03" = "oklch(0.52 0 0)"
"04" = "oklch(0.64 0 0)"
"05" = "oklch(0.76 0 0)"
"06" = "oklch(0.83 0 0)"
"07" = "oklch(0.89 0 0)"
"08" = "oklch(0.925 0 0)"
"09" = "oklch(0.96 0 0)"

[rainbow]
marks = ["red", "orange", "yellow", "green", "blue", "purple", "pink"]

[rainbow.hues]
red = "oklch(0.61 0.167 27)"
orange = "oklch(0.68 0.15 46)"
yellow = "oklch(0.82 0.135 96)"
green = "oklch(0.69 0.126 152)"
blue = "oklch(0.64 0.119 248)"
purple = "oklch(0.61 0.15 292)"
pink = "oklch(0.68 0.15 350)"

# Steps are signed OKLCH offsets added to each rainbow hue, not complete colors.
# The final 0 keeps the hue unchanged; base adds no offsets.
[rainbow.steps]
dim = "oklch(-0.17 -0.02 0)"
base = "oklch(0.0 0.0 0)"
bright = "oklch(0.13 -0.03 0)"
deep = "oklch(-0.26 0.0 0)"

# How the palettes are applied to glyph tiles and outline points.
[drawing]
# Rainbow step used for glyph marks: dim, base, bright, or deep.
markStep = "base"
# Keep Gray's filled glyph tiles with dark, readable ink.
markStyle = "fill"
markOutline = "baseUi.00"
markInk = "baseUi.00"
# Darker colored rings stay legible on the light canvas.
pointStyle = "ring"
pointHalo = true

[surfaces]
# Match Light's pale window chrome with softer gray panels and canvas.
app = "baseUi.08"
titlebar = "baseUi.08"
header = "baseUi.08"
panel = "baseUi.07"
canvas = "baseUi.08"
# Independent inspector preview surface; keep the drawing canvas unchanged.
glyphPreview = "baseUi.08"
control = "baseUi.06"
button = "baseUi.07"
buttonHover = "baseUi.08"
field = "baseUi.08"
outline = "baseUi.05"
fieldOutline = "baseUi.05"
divider = "baseUi.06"
tabRail = "baseUi.05"
inactiveTab = "baseUi.06"
gridBackground = "baseUi.06"
cellShadow = "baseUi.05"
floatingPaneHeader = "baseUi.06"
sliderTrack = "baseUi.04"
# Slider knob: two stops below the panel, then one stop brighter when active.
sliderThumb = "baseUi.05"
sliderThumbActive = "baseUi.06"
# Main-panel shadows in solid mode; glyph shadows use cellShadow above.
panelShadow = "baseUi.06"
# Independent pale gray overlay for the macOS material.
backdropTint = "#E5E5E5"

[text]
primary = "baseUi.01"
secondary = "baseUi.02"
muted = "baseUi.02"
subdued = "baseUi.03"
overlay = "baseUi.00"
glyph = "baseUi.01"
headerInk = "baseUi.01"
appInk = "baseUi.01"
headerMutedInk = "baseUi.02"

[roles]
# Save-state labels use darker hues on the pale title bar, independently of glyph marks.
savedInk = "rainbow.green.deep"
unsavedInk = "rainbow.red.dim"
gridSelected = "baseUi.02"
cellSelectedFill = "baseUi.02"
cellSelectedInk = "baseUi.09"
controlSelected = "baseUi.02"
controlSelectedInk = "baseUi.09"
designGridFine = "baseUi.07"
designGridCoarse = "baseUi.06"
accent = "rainbow.green.dim"
warning = "rainbow.orange.dim"
danger = "rainbow.red.dim"
selection = "rainbow.orange.dim"
component = "rainbow.purple.dim"
componentSelected = "rainbow.pink.dim"
pointSmooth = "rainbow.blue.dim"
pointCorner = "rainbow.green.dim"
pointOffcurve = "rainbow.purple.dim"
pointHyper = "rainbow.blue.dim"
pointSelected = "rainbow.orange.dim"
pointInner = "baseUi.08"
startNode = "rainbow.orange.dim"
textCursor = "rainbow.orange.dim"
kernActive = "rainbow.blue.dim"
kernPrevious = "rainbow.orange.dim"
pathStroke = "baseUi.01"
previewFill = "baseUi.02"
background = "baseUi.03"
reference = "baseUi.06"
halo = "baseUi.08"
metricQuiet = "baseUi.07"
outlineFill = "baseUi.06"
metricsLine = "baseUi.05"
readonlyPoint = "baseUi.03"
continuityG2 = "rainbow.blue.dim"
continuityG1 = "rainbow.yellow.dim"
continuityLine = "baseUi.03"
continuityKink = "rainbow.red.dim"
popcount1 = "#17B870"
popcount2 = "#FFDB33"
popcount3 = "#FF990F"
popcount4 = "#FF4A3D"

[window]
# Native macOS blur; unsupported hosts keep the flat app/header colors.
# Restart when changing native transparency.
blurBackground = true
# A light tint keeps the window ground pale over dark wallpaper.
blurTintOpacity = 0.65
# Hide only main-panel shadows over blur; keep glyph shadows.
shadowPanels = false

[geometry]
# Shared glyph tile, floating panel, and control geometry.
radius = 8.0
radiusPanel = 10.0
shadowPanel = true
radiusControl = 4.0
stroke = 1.0
strokeEmphasis = 2.0
