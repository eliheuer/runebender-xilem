# OKLCH order: lightness (0–1), chroma (0+, no fixed maximum), hue (0–360 degrees).
# Ten Base UI stops, 00–09, progress from darkest to lightest.
# Rainbow names carry the same mark meaning across themes.
# See https://runebender.org/docs/themes.html for the full format.
formatVersion = 1
id = "light"
name = "Light"
markStep = "base"
markStyle = "fill"
markOutline = "baseUi.01"
markInk = "baseUi.00"
pointStyle = "ring"
pointHalo = true

[baseUi]
"00" = "oklch(0.18 0 255)"
"01" = "oklch(0.31 0 255)"
"02" = "oklch(0.43 0 255)"
"03" = "oklch(0.55 0 255)"
"04" = "oklch(0.65 0 255)"
"05" = "oklch(0.76 0 255)"
"06" = "oklch(0.81 0 255)"
"07" = "oklch(0.86 0 255)"
"08" = "oklch(0.91 0 255)"
"09" = "oklch(0.96 0 255)"

[rainbow]
marks = ["red", "orange", "yellow", "green", "blue", "purple", "pink"]

[rainbow.hues]
red = "oklch(0.61 0.167 27)"
orange = "oklch(0.68 0.15 46)"
yellow = "oklch(0.82 0.135 96)"
green = "oklch(0.69 0.126 152)"
teal = "oklch(0.7 0.095 186)"
blue = "oklch(0.64 0.119 248)"
purple = "oklch(0.61 0.15 292)"
pink = "oklch(0.68 0.15 350)"

# Steps are signed OKLCH offsets added to each rainbow hue, not complete colors.
# The final 0 keeps the hue unchanged; base adds no offsets.
[rainbow.steps]
dim = "oklch(-0.17 -0.02 0)"
base = "oklch(0.0 0.0 0)"
bright = "oklch(0.13 -0.03 0)"
deep = "oklch(-0.26 0.0 0)"

[surfaces]
app = "baseUi.08"
panel = "baseUi.09"
titlebar = "baseUi.07"
control = "baseUi.08"
button = "baseUi.09"
buttonHover = "baseUi.08"
field = "baseUi.09"
outline = "baseUi.05"
fieldOutline = "baseUi.08"
divider = "baseUi.06"
canvas = "baseUi.09"
tabRail = "baseUi.07"
inactiveTab = "baseUi.08"
header = "baseUi.00"
gridBackground = "baseUi.06"
cellShadow = "baseUi.03"
floatingPaneHeader = "baseUi.08"
sliderTrack = "baseUi.04"

[text]
primary = "baseUi.01"
secondary = "baseUi.02"
muted = "baseUi.02"
subdued = "baseUi.03"
overlay = "baseUi.00"
glyph = "baseUi.01"
headerInk = "baseUi.09"

[roles]
gridSelected = "baseUi.01"
cellSelectedFill = "baseUi.01"
cellSelectedInk = "baseUi.09"
controlSelected = "baseUi.01"
controlSelectedInk = "baseUi.09"
designGridFine = "baseUi.07"
designGridCoarse = "baseUi.06"
accent = "rainbow.green.dim"
warning = "rainbow.orange.dim"
danger = "rainbow.red.dim"
selection = "rainbow.orange.dim"
component = "rainbow.purple.dim"
componentSelected = "rainbow.pink.dim"
pointSmooth = "rainbow.blue.dim"
pointCorner = "rainbow.green.dim"
pointOffcurve = "rainbow.purple.dim"
pointHyper = "rainbow.teal.dim"
pointSelected = "rainbow.orange.dim"
pointInner = "baseUi.09"
startNode = "rainbow.orange.dim"
textCursor = "rainbow.orange.dim"
kernActive = "rainbow.teal.dim"
kernPrevious = "rainbow.orange.dim"
pathStroke = "baseUi.01"
previewFill = "baseUi.02"
background = "baseUi.03"
reference = "baseUi.06"
halo = "baseUi.09"
metricQuiet = "baseUi.06"
outlineFill = "baseUi.05"
metricsLine = "baseUi.05"
readonlyPoint = "baseUi.03"
continuityG2 = "rainbow.teal.dim"
continuityG1 = "rainbow.yellow.dim"
continuityLine = "baseUi.03"
continuityKink = "rainbow.red.dim"
popcount1 = "#17B870"
popcount2 = "#FFDB33"
popcount3 = "#FF990F"
popcount4 = "#FF4A3D"

[geometry]
radius = 3.0
radiusControl = 6.0
stroke = 1.0
strokeEmphasis = 2.0
