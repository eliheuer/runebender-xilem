[package]
name = "nufo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "The NUFO neural font source format: labeled samples of writing in a UFO"
repository = "https://github.com/eliheuer/runebender-xilem"
publish = false

[lints]
workspace = true

[dependencies]
kurbo = "0.13"
norad = "0.18"
plist = { version = "1.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
