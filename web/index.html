<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runebender</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#999;color:#222;font:13px system-ui,sans-serif}#app{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-content:center;background:#aaa;z-index:2}#loading[hidden]{display:none}#error{max-width:640px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="loading"><div id="status">Loading Runebender…</div><pre id="error"></pre></div>
<canvas id="app" tabindex="0" aria-label="Runebender font editor. Double-click a glyph to edit it."></canvas>
<textarea id="text-input" aria-label="Runebender text input" autocomplete="off" autocapitalize="off" spellcheck="false" style="position:fixed;width:1px;height:18px;padding:0;border:0;opacity:0;resize:none;pointer-events:none"></textarea>
<script type="module" src="./app.js"></script>
</body></html>
