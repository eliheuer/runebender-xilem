[package]
name = "runebender-xilem"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
description = "The Runebender font editor on Xilem, mirroring runebender-gpui for a framework comparison"
repository = "https://github.com/eliheuer/runebender-xilem"
publish = false

[[bin]]
name = "runebender-xilem"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Upstream Xilem, pinned. This editor builds on the real thing, so that
# comparing it against runebender-gpui measures Xilem and not a fork.
xilem = { git = "https://github.com/linebender/xilem", rev = "ce7b04d2ba2d9d7a8c364f2ab109e2083121e144" }
masonry = { git = "https://github.com/linebender/xilem", rev = "ce7b04d2ba2d9d7a8c364f2ab109e2083121e144" }
# Pinned, like every other git dependency here. A floating branch makes
# `cargo install --git` need --locked and makes two checkouts of the same
# source possible if anything else names it by bare URL.
runebender-core = { git = "https://github.com/eliheuer/runebender-core", rev = "403d51b4b4ab5e335843d11d7fd4d669be68cee0" }
norad = "0.18"
kurbo = "0.13"
linesweeper = "0.4"
winit = "0.30"
# Native menu bar. Xilem is on winit, which has no menu API, so this is
# the application's job. Tauri's crate, the same one Zed-class apps use.
muda = "0.19"
# Reload when the sources change under us, the way the GPUI build does.
notify = "8"
# Headless rendering, for review screenshots and for agents to see their
# own output. Upstream Xilem has no such path, so this is app-side.
tokio = { version = "1", features = ["rt"] }
# The headless renderer. masonry_testing would be less code, but it
# builds its RenderRoot with system fonts turned off, so screenshots of
# anything outside the default font come out blank. See src/screenshot.rs.
imaging_vello_cpu = "0.0.1"
image = "0.25"

[dev-dependencies]
# Still the right tool for widget tests, where a fixed font and no system
# fonts is exactly what you want. Just not for screenshots of the app.
masonry_testing = { git = "https://github.com/linebender/xilem", rev = "ce7b04d2ba2d9d7a8c364f2ab109e2083121e144" }

[profile.release]
lto = "thin"
codegen-units = 1
