[workspace]
members = [".", "crates/runebender-core"]
default-members = ["."]
resolver = "2"

[package]
name = "runebender"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
description = "Runebender, a font editor built with Xilem"
repository = "https://github.com/eliheuer/runebender-xilem"
keywords = ["font", "editor", "typography", "ufo", "xilem"]
categories = ["graphics", "text-editors"]
publish = false

[[bin]]
name = "runebender"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

# LINEBENDER LINT SET - Cargo.toml - v8
# See https://linebender.org/wiki/canonical-lints/
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"

elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
too_many_arguments = "allow"

allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"

cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
# END LINEBENDER LINT SET

[dependencies]
# Upstream Xilem, pinned so framework changes remain deliberate and reviewable.
xilem = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a" }
masonry = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a" }
# The GUI and headless tools share this workspace library.
runebender-core = { path = "crates/runebender-core" }
# Command parsing and MCP proof encoding belong to the application.
clap = { version = "4", features = ["derive"] }
base64 = "0.22.1"
norad = "0.18"
# Typed values in a nodes file, which core keeps as JSON.
regex = "1"
serde_json = "1"
kurbo = "0.13"
linesweeper = "0.4"
# System text clipboard for the glyph-grid Copy as Text command.
copypasta = "0.10.2"
winit = "0.30"
# Cross-platform native file and folder prompts for File, Nodes, and image
# commands. Xilem/winit intentionally do not supply dialog APIs.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Headless rendering, for review screenshots and for agents to see their
# own output. Upstream Xilem has no such path, so this is app-side.
tokio = { version = "1", features = ["rt", "time"] }
# The headless renderer. masonry_testing would be less code, but it
# builds its RenderRoot with system fonts turned off, so screenshots of
# anything outside the default font come out blank. See src/screenshot.rs.
imaging_vello_cpu = "0.0.1"
# Writing the screenshot. PNG is the only format it needs.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS owns its menu bar at the application level. Linux and Windows use the
# in-window menu and must not initialize muda's global native event channel.
muda = "0.19"

[target.'cfg(unix)'.dependencies]
# Reload when the font sources change on disk. Windows leaves this off until
# its native event-loop startup is stable under the smoke test.
notify = "8"

[dev-dependencies]
# Still the right tool for widget tests, where a fixed font and no system
# fonts is exactly what you want. Just not for screenshots of the app.
masonry_testing = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a" }

[profile.release]
lto = "thin"
codegen-units = 1
